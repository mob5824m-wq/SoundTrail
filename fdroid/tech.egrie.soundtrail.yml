AntiFeatures:
  NonFreeNet:
    en-US: Three optional services it can reach are not free software and cannot be
      self-hosted - map tiles for pin and trip maps, TheAudioDB song lookup, and whatever
      AI provider you point the mood engine at (OpenAI, Google Gemini or Arena AI).
      Each is off until you enter it. Jellyfin, a local Ollama server and the sync
      server are all free software you host yourself.
