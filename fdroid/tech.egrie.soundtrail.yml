AntiFeatures:
  NonFreeAdd:
    en-US: Soundtrail can hand a song to the proprietary Spotify, SoundCloud and YouTube
      Music apps, including patched YouTube Music builds (Morphe, ReVanced). It only
      lists what is installed; nothing proprietary is bundled.
  NonFreeNet:
    en-US: Optional connections to third-party online services the listener chooses
      and supplies credentials for - Spotify, SoundCloud, YouTube, map tiles, TheAudioDB,
      and any OpenAI-compatible or Google Gemini AI provider. All are off until configured.
