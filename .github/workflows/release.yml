name: Release on merge

# The first release uses the version already configured in Gradle (v1.0.9 here).
# After that tag exists, each merged pull request bumps the patch (versionCode +1,
# versionName +0.0.1) and publishes a release with generated notes and the debug APK.
# This cannot loop: version bumps are pushed by the workflow token, and pushes made
# with that token do not start further workflow runs.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two merges in a row must not race for the same version number.
concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  release:
    # Closing a pull request without merging must not release anything.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: gradle/actions/setup-gradle@v6

      # Keep the release gate complete even if repository branch rules are relaxed.
      - name: Run server API tests
        run: python -m unittest discover -s server -v

      - name: Select the release version
        id: bump
        run: python3 .github/scripts/bump_version.py

      # Runs after the version is selected, so it checks the version that is about to be
      # tagged. F-Droid publishes "What's new" per versionCode and truncates anything over
      # its 500 character limit without failing, so a tag with no changelog (or a too-long
      # one) would put a broken listing on f-droid.org and nothing there would report it.
      # --write-missing-changelog fills the gap from the merged pull request title; a
      # changelog committed by hand always wins, because an existing file is left alone.
      - name: Check the F-Droid requirements for this version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -eu
          python3 tools/fdroid_check.py --write-missing-changelog \
            --text "${PR_TITLE:-Soundtrail $VERSION}"

      - name: Run F-Droid's own tools on the recipe and the source tree
        run: |
          set -eu
          # fdroidserver's dependencies do not all publish wheels for the newest Python
          # yet, and this job's setup-python is 3.14, so build the virtualenv from the
          # runner's system Python (3.12 on ubuntu-24.04) when it is there.
          py=python3
          if [ -x /usr/bin/python3 ]; then py=/usr/bin/python3; fi
          # Outside the checkout: the source scanner walks the tree, and fdroidserver's own
          # dependencies read to it as prebuilt binaries.
          venv="${RUNNER_TEMP:-/tmp}/fdroid-venv"
          # An unavailable fdroidserver must not block a release: the step above already
          # checked every requirement in this repository's own code, and the `fdroid` job
          # in the Android build workflow runs the real tools strictly on the same commit.
          # A finding, as opposed to a failed install, does block the release.
          if ! "$py" -m venv "$venv" \
            || ! "$venv/bin/pip" install --quiet --disable-pip-version-check fdroidserver; then
            echo "::warning title=F-Droid tools not run::fdroidserver could not be installed, so 'fdroid lint' and the source scanner were skipped for this release. tools/fdroid_check.py did run."
            exit 0
          fi
          "$venv/bin/python" tools/fdroid_lint.py --require

      # Tests and APK build finish before anything is pushed, so a failure leaves main untouched.
      # assembleRelease is the variant F-Droid builds from the tag, so it has to work here
      # and it has to stay unsigned - F-Droid signs what it publishes with its own key.
      - name: Test and build the release APK
        run: |
          set -eu
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test ! -f app/build/outputs/apk/release/app-release.apk

      - name: Commit, tag, and push the release version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The version bump edits app/build.gradle.kts, and the F-Droid gate above may have
          # added a new file under fastlane/.../changelogs/. Stage both explicitly: the old
          # `git commit -a` only commits tracked files, so a generated changelog would have
          # stayed out of the commit and out of the tag F-Droid builds from.
          git add app/build.gradle.kts fastlane/metadata/android/en-US/changelogs
          if git diff --cached --quiet; then
            echo "Using existing version $VERSION; no version bump commit is needed."
          else
            git commit -m "Bump version to $VERSION [skip ci]"
            if ! git push origin HEAD:main; then
              echo "::error title=Cannot push the version bump::Direct pushes to main were rejected. Allow GitHub Actions to bypass the branch protection rule for main (Settings, Branches), or push the version bump yourself."
              exit 1
            fi
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          ASSET: ${{ steps.bump.outputs.asset }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          notes="Soundtrail $VERSION — published automatically after the release checks. The first release uses the configured version; later releases increment the patch. Earlier releases (v1.0.1–v1.0.8) remain at https://github.com/egrie-tech/Geotagged-Music-App/releases. The attached APK is the debug build, signed with the shared debug key committed at keystore/soundtrail-debug.p12, so it installs as an update over earlier releases (an APK installed before that key existed needs one uninstall first — see the README)."
          if [ -n "${PR_NUMBER:-}" ]; then
            notes="$notes"$'\n\n'"Merged: #$PR_NUMBER $PR_TITLE"
          fi
          gh release create "v$VERSION" "$ASSET" \
            --target main \
            --title "Soundtrail $VERSION" \
            --notes "$notes" \
            --generate-notes
